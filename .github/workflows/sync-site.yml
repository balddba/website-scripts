name: Notify site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger balddba.com catalog sync
        env:
          SYNC_URL: ${{ secrets.SITE_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SITE_SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$SYNC_SECRET" ]; then
            echo "SITE_SYNC_URL or SITE_SYNC_SECRET is not set; skipping"
            exit 0
          fi
          export BODY='{"ref":"refs/heads/main"}'
          SIG="$(python3 -c 'import hashlib, hmac, os; print("sha256=" + hmac.new(os.environ["SYNC_SECRET"].encode(), os.environ["BODY"].encode(), hashlib.sha256).hexdigest())')"
          curl -fsS -X POST "$SYNC_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: ${SIG}" \
            --data "$BODY"
